<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Prakambanam &mdash; Onam Games</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  /* Same token system as the individual games, so the hub reads as one
     connected event rather than a generic index of links. */
  :root{
    --kasavu:      #FBF2DD;
    --kasavu-dim:  #F3E6C8;
    --gold:        #C9982E;
    --gold-light:  #E8C468;
    --gold-deep:   #8C6A1E;
    --marigold:    #F2871D;
    --red:         #C1272D;
    --ink:         #40230F;
    --ink-soft:    #6B4A2C;
    --maroon:      #5C1A22;
    --maroon-deep: #2E0A10;
    --font-display: 'Yatra One', cursive;
    --font-body: 'Poppins', sans-serif;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{ margin: 0; min-height: 100%; }

  body{
    font-family: var(--font-body);
    color: var(--kasavu);
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(232,196,104,0.16), transparent 55%),
      linear-gradient(165deg, var(--maroon) 0%, var(--maroon-deep) 65%, #1C0509 100%);
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  /* ==================== HERO ==================== */
  .hero{
    text-align: center;
    margin-bottom: 40px;
  }
  .hero .ring{
    width: 84px;
    height: 84px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, var(--gold-light) 0deg 8deg, var(--gold) 8deg 16deg);
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  .hero .ring-inner{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--kasavu);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .hero h1{
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(34px, 9vw, 52px);
    margin: 0 0 8px;
    color: var(--gold-light);
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    letter-spacing: 0.5px;
  }
  .hero p{
    margin: 0;
    font-size: 14px;
    color: var(--kasavu-dim);
    opacity: 0.85;
    letter-spacing: 0.3px;
  }

  /* ==================== GAME CARDS ==================== */
  .games{
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 560px){
    .games{ grid-template-columns: 1fr 1fr; }
  }

  .card{
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 22px 20px;
    border-radius: 20px;
    background: rgba(251,242,221,0.06);
    border: 1px solid rgba(201,152,46,0.5);
    backdrop-filter: blur(6px);
    text-decoration: none;
    color: inherit;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .card:active{ transform: scale(0.98); }
  a.card:hover{
    border-color: var(--gold-light);
    background: rgba(251,242,221,0.1);
  }

  .card .icon{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-light), var(--gold) 60%, var(--gold-deep));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .card h2{
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 21px;
    margin: 4px 0 0;
    color: var(--kasavu);
  }
  .card p.desc{
    margin: 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--kasavu-dim);
    opacity: 0.85;
  }
  .card .play{
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--maroon-deep);
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    padding: 8px 14px;
    border-radius: 999px;
    width: fit-content;
  }

  .card.placeholder{
    border-style: dashed;
    border-color: rgba(232,196,104,0.35);
    background: rgba(251,242,221,0.03);
    align-items: flex-start;
    justify-content: center;
    min-height: 120px;
    opacity: 0.75;
  }
  .card.placeholder .icon{
    background: rgba(232,196,104,0.15);
    color: var(--gold-light);
  }
  .card.placeholder p.desc{ font-style: italic; }

  /* ==================== FOOTER ==================== */
  footer{
    text-align: center;
    margin-top: 46px;
    font-size: 11px;
    color: var(--kasavu-dim);
    opacity: 0.55;
    letter-spacing: 0.3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <div class="ring"><div class="ring-inner">🌼</div></div>
    <h1>Prakambanam</h1>
    <p>Onam games for the community &middot; pick one to play</p>
  </div>

  <div class="games">

    <!-- ============ GAME CARD: Tilt-to-Paint Pookkalam ============ -->
    <a class="card" href="./pookkalam/">
      <div class="icon">🌸</div>
      <h2>Tilt-to-Paint Pookkalam</h2>
      <p class="desc">Tilt your phone to roll a marble and paint a symmetrical flower carpet.</p>
      <span class="play">Play &rarr;</span>
    </a>

    <!-- ============ Add new game cards here as they're built ============
         Copy the block above, update href, icon, title, and description.
         href should point to the game's own subfolder, e.g. "./quiz/" -->

    <div class="card placeholder">
      <div class="icon">&#10024;</div>
      <h2>More games coming soon</h2>
      <p class="desc">New games will appear here as they're added.</p>
    </div>

  </div>

  <footer>Made for the apartment Onam celebration</footer>
</div>

</body>
</html>
